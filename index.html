<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>熊出没アニメーション（完全版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { width: 100%; height: calc(100% - 60px); }

  #controls {
    height: 60px;
    padding: 8px;
    box-sizing: border-box;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: system-ui, sans-serif;
    position: fixed;
    bottom: 0;
    width: 100%;
  }

  #clock {
    font-weight: bold;
    font-size: 16px;
  }

  .time-label {
    background: rgba(255,255,255,0.85);
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 12px;
  }

  .popup-box {
    font-size: 14px;
    line-height: 1.4;
  }
  .popup-box a {
    color: #0066cc;
    text-decoration: none;
  }
  .popup-box a:hover {
    text-decoration: underline;
  }
</style>

<script src="data.js"></script>
</head>

<body>

<div id="map"></div>

<!-- ★ 追加：4コマアニメ表示用 -->
<img id="comicPlayer" style="
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:80%;
  z-index:9999;
">

<div id="controls">
  <button id="playBtn">▶ 再生</button>
  <button id="pauseBtn">⏸ 一時停止</button>
  <span id="clock">--:--</span>
</div>

<script>
// --- 地図の初期化 ---
const map = L.map('map').setView([36.55, 139.88], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// --- 熊アイコン ---
const bearIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/618x618/1F43B.png",
    iconSize: [45, 45],
    iconAnchor: [22, 22]
});

// --- 赤マーカー ---
const redMarker = L.icon({
  iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
  shadowUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-shadow.png",
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// --- 星マーカー ---
const starMarker = L.icon({
  iconUrl: "https://raw.githubusercontent.com/snj-u/utsunomiya-bear/main/star.png",
  shadowUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-shadow.png",
  iconSize: [41, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// --- 軌跡 ---
const latlngs = bearData.map(p => [p.lat, p.lng]);

L.polyline(latlngs, {
  color: "#ff6600",
  weight: 4,
  opacity: 0.8
}).addTo(map);

// --- 時刻ラベル ---
const markers = [];

bearData.forEach((p, i) => {
  const m = L.marker([p.lat, p.lng])
    .addTo(map)
    .bindTooltip(
      `<div class="time-label">${p.time}</div>`,
      { permanent: true, direction: "right" }
    );
  markers.push(m);
});

function updateLabels() {
  const zoom = map.getZoom();
  markers.forEach((m, i) => {
    if (zoom >= 15) m.openTooltip();
    else m.closeTooltip();
  });
}
map.on("zoomend", updateLabels);
updateLabels();

// --- ポップアップ ---
bearData.forEach((p, i) => {
  const html = `
    <div class="popup-box">
      <strong>${p.time}</strong><br>
      ${p.note}<br><br>
      ${p.video ? `<a href="${p.video}" target="_blank">📹 動画を見る</a><br>` : ""}
      ${p.streetview ? `<a href="${p.streetview}" target="_blank">🛰 ストリートビュー</a>` : ""}
    </div>
  `;

  const icon = (p.video || p.streetview) ? starMarker : redMarker;

  L.marker([p.lat, p.lng], { icon })
    .addTo(map)
    .bindPopup(html);
});

// --- アニメーション（熊） ---
let paused = true;
let startTime = null;
const totalDuration = 20000;

const marker = L.marker(latlngs[0], { icon: bearIcon }).addTo(map);

function updateClock(t) {
  document.getElementById("clock").textContent = t;
}

// ★ 追加：4コマ画像
const comicFrames = [
  "frame1.png",
  "frame2.png",
  "frame3.png",
  "frame4.png"
];

// ★ 追加：4コマ再生（最後のコマで停止）
function playComicAnimation(callback) {
  let index = 0;
  const img = document.getElementById("comicPlayer");
  img.style.display = "block";

  const interval = setInterval(() => {
    img.src = comicFrames[index];
    index++;

    if (index >= comicFrames.length) {
      clearInterval(interval);

      // ★ 最後のコマを表示したまま停止（非表示にしない）
      if (callback) callback();
    }
  }, 1500);
}

// ★ 追加：特別地点（東簗瀬1丁目）
const specialPoint = { lat: 36.537025, lng: 139.904048 };

function animate() {
  if (paused) return;

  const now = Date.now();
  const elapsed = now - startTime;
  const t = elapsed / totalDuration;

  const totalPoints = latlngs.length - 1;
  const pos = t * totalPoints;

  const idx = Math.floor(pos);
  const frac = pos - idx;

  if (idx < totalPoints) {
    const [lat1, lng1] = latlngs[idx];
    const [lat2, lng2] = latlngs[idx + 1];

    const lat = lat1 + (lat2 - lat1) * frac;
    const lng = lng1 + (lng2 - lng1) * frac;

    marker.setLatLng([lat, lng]);
    updateClock(bearData[idx].time);

    // ★ 到達判定
    if (!window._comicPlayed) {
      const bearPos = marker.getLatLng();
      const latDiff = Math.abs(bearPos.lat - specialPoint.lat);
      const lngDiff = Math.abs(bearPos.lng - specialPoint.lng);

      if (latDiff < 0.0001 && lngDiff < 0.0001) {
        window._comicPlayed = true;

        paused = true;

        // ★ 特別地点の強調演出 ★
        // ① ズームイン
        map.flyTo([specialPoint.lat, specialPoint.lng], 16, { duration: 1.5 });

        // ② パルス（光る円）
        const pulse = L.circle([specialPoint.lat, specialPoint.lng], {
  radius: 50,
  color: "#ff0000",
  fillColor: "#ff4444",
  fillOpacity: 0.5
}).addTo(map);

        setTimeout(() => map.removeLayer(pulse), 3000);
        // 3秒待ってから4コマ再生
        setTimeout(() => {
          playComicAnimation(() => {
            // ★ 再生後は止めたまま（再開しない）
          });
        }, 3000);
      }
    }

    requestAnimationFrame(animate);
  }
}

// ▶ 再生ボタン
document.getElementById("playBtn").onclick = () => {
  // ★ 4コマを消す
  document.getElementById("comicPlayer").style.display = "none";

  // ★ 最初から再開
  window._comicPlayed = false;
  paused = false;
  startTime = Date.now();
  animate();
};

// ⏸ 一時停止
document.getElementById("pauseBtn").onclick = () => {
  paused = true;
};
</script>
</body>
</html>
