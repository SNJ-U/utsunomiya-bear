<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>熊出没アニメーション（完全版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { width: 100%; height: calc(100% - 60px); }

  #controls {
    height: 60px;
    padding: 8px;
    box-sizing: border-box;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: system-ui, sans-serif;
    position: fixed;
    bottom: 0;
    width: 100%;
  }

  #clock {
    font-weight: bold;
    font-size: 16px;
  }

  .time-label {
    background: rgba(255,255,255,0.85);
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 12px;
  }
</style>

<script src="data.js"></script>
</head>

<body>

<div id="map"></div>

<div id="controls">
  <button id="playBtn">▶ 再生</button>
  <button id="pauseBtn">⏸ 一時停止</button>
  <span id="clock">--:--</span>
</div>

<script>
// --- 地図の初期化 ---
const map = L.map('map').setView([36.55, 139.88], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// --- 軌跡（Polyline） ---
const latlngs = bearData.map(p => [p.lat, p.lng]);

L.polyline(latlngs, {
  color: "#ff6600",
  weight: 4,
  opacity: 0.8
}).addTo(map);

// --- 時刻ラベル（ズームで表示切替） ---
const markers = [];

bearData.forEach((p, i) => {
  const m = L.marker([p.lat, p.lng])
    .addTo(map)
    .bindTooltip(
      `<div class="time-label">${p.time}</div>`,
      { permanent: true, direction: "right" }
    );
  markers.push(m);
});

function updateLabels() {
  const zoom = map.getZoom();
  markers.forEach((m, i) => {
    if (zoom >= 15) m.openTooltip();
    else m.closeTooltip();
  });
}
map.on("zoomend", updateLabels);
updateLabels();

// --- 熊アイコン（黒いシルエット） ---
const bearIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/618x618/1F43B.png",
    iconSize: [45, 45],
    iconAnchor: [22, 22]
});

// --- アニメーション（滑らか補間版） ---
let paused = true;
let startTime = null;
const totalDuration = 20000; // 1日20秒

const marker = L.marker(latlngs[0], { icon: bearIcon }).addTo(map);

function updateClock(t) {
  document.getElementById("clock").textContent = t;
}

function animate() {
  if (paused) return;

  const now = Date.now();
  const elapsed = now - startTime;
  const t = elapsed / totalDuration;

  const totalPoints = latlngs.length - 1;
  const pos = t * totalPoints;

  const idx = Math.floor(pos);
  const frac = pos - idx;

  if (idx < totalPoints) {
    const [lat1, lng1] = latlngs[idx];
    const [lat2, lng2] = latlngs[idx + 1];

    const lat = lat1 + (lat2 - lat1) * frac;
    const lng = lng1 + (lng2 - lng1) * frac;

    marker.setLatLng([lat, lng]);
    updateClock(bearData[idx].time);

    requestAnimationFrame(animate);
  }
}

// --- 再生ボタン ---
document.getElementById("playBtn").onclick = () => {
  paused = false;
  startTime = Date.now();
  animate();
};

// --- 一時停止ボタン ---
document.getElementById("pauseBtn").onclick = () => {
  paused = true;
};
</script>
</body>
</html>
